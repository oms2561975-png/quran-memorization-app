name: Build Quran App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Java
        run: java -version

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Download Quran data
        run: |
          mkdir -p app/src/main/assets
          curl -L \
            "https://raw.githubusercontent.com/dotquran/corpus/main/processed/uthmani/quran-uthmani.json" \
            -o app/src/main/assets/quran.json
          echo "Quran data downloaded:"
          ls -lh app/src/main/assets/quran.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
